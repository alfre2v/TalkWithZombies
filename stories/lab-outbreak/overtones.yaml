# The overtones each kind of round may use: one, or two neighbors; the director draws one per round.
kinds:
  orientation: [neutral]
  repair: [positive]
  exchange: [positive, neutral]
  re-call: [neutral]
  breakdown: [neutral, negative]
  switch-off: [neutral, negative]

# Free rounds: an overtone is held for a stretch (show.overtone_hold, with jitter); when the hold ends, the next
# is drawn among the current one and its neighbors, with these weights.
weights:
  positive: 1
  neutral: 2
  negative: 3

# The ambience: which clips of Sounds/ambience/ play under this story — the world outside the lab, heard through the
# broadcast: the dead, the fighting, the people, the weather. The clips ship with the app in Sounds/ambience/, with
# Sounds/ambience/ambience.json (what is on disk: each clip's kind, length and measured gain) and CREDITS.md, all
# written by zombie-radio's tools/sounds/prepare_ambience.py; this file only chooses. The 31 were generated with
# Stable Audio 3 Small-SFX and chosen by the owner by ear on 2026-10-07 (zombie-radio's TODO, Task 13). A texture
# (long, continuous) plays one after another; a spot (short, a single event) now and then, on top. Each clip:
#   file     its file there
#   enabled  true or false (optional; true when left out)
#   gain_db  a change of its level by ear, in dB, added to the measured gain (optional; 0 when left out). 0 changes
#            nothing; -3 is a little quieter, -6 half the amplitude, +6 twice it
#   keywords the words or phrases of an event that cue the clip (optional; none when left out): a sound cue. When a
#            free round's event says one (a whole word or phrase, any case), the clip plays as the event is read —
#            a spot at once, a texture in place of the current one, to its end; several clips matched, one at
#            random. Keep them precise: a loose word plays a sound where it does not belong ("blast" also means a
#            blast door; "the moaning stops" names a moan). The dead's own sounds have none: every event naming
#            them is about something else. List each form (explosion, explosions, explodes): no word stems
# Read when a run opens: change a line, reload the show page and press Start, and the new run plays the new list,
# with no restart of the app. A clip enabled here but missing there is skipped (the app's log says so); without this
# file, every clip there plays.
clips:

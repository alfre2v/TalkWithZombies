# The static bed: which clips of Sounds/bed/ play under this story — radio static, played quietly under the voices
# by the looks (the fork's docs/runbooks/show-page.md, "The static bed"). The clips live outside git, in Sounds/bed/,
# put there with Sounds/bed/bed.json (what is on disk, each clip's length and measured gain) by zombie-radio's
# tools/sounds/prepare_bed.py; this file only chooses. Each clip:
#   file     its file there
#   enabled  true or false (optional; true when left out)
#   gain_db  a change of its level by ear, in dB, added to the measured gain (optional; 0 when left out). 0 changes
#            nothing; -3 is a little quieter, -6 half the amplitude, +6 twice it
# Read at every Start: change a line, press Start, and the new list plays. A clip enabled here but missing there is
# skipped (the app's log says so); without this file, every clip there plays.
clips:
